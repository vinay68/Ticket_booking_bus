    <script>
  // Collect selected seat and store it in localStorage
  const proceedBtn = document.querySelector('.button-group .back a[href="reservation.html"]');
  proceedBtn.addEventListener('click', (e) => {
    const selectedSeat = document.querySelector('input[type="checkbox"]:checked');
    if (!selectedSeat) {
      alert("Please select a seat before proceeding.");
      e.preventDefault(); // Prevent navigation
    } else {
      localStorage.setItem("selectedSeat", selectedSeat.id); // Store selected seat ID
    }
  });
</script>
