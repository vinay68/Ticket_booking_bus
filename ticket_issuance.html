<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticket Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
      margin-top: 30px;
      background: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #f8d7da;
      color: #842029;
      border: 1px solid #f5c2c7;
      border-radius: 4px;
    }
    a {
      text-decoration: none;
      color: white;
    }
    .box1 {
      color: #ff8f05;
      margin-top: 30px;
    }
    .box2 {
      color: white;
      margin-top: 30px;
    }
    .box3 {
      color: #03fc20;
      margin-top: 30px;
    }
    .logo {
      text-align: left;
      font-size: 20px;
    }
    .heading {
      margin-left: 370px;
      font-size: 30px;
    }
    footer {
      color: white;
      margin-top: 350px;
      background-color: black;
      height: 80px;
    }
    p {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="logo">
      <span class="box1">Speed</span><span class="box2">star</span><span class="box3">Travels</span>
      <span class="heading">Ticket Management System</span>
    </h1>
  </header>
  <main>
    <h2>Ticket Form</h2>
    <form id="ticketForm">
      <div class="form-group">
        <label for="passengerName">Passenger Name</label>
        <input type="text" id="passengerName" name="passengerName" required />
      </div>

      <div class="form-group">
        <label for="ticketSelection">Ticket Type</label>
        <select id="ticketSelection" name="ticketSelection">
          <option value="Economy">Economy</option>
          <option value="Business">Business</option>
          <option value="First Class">First Class</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fare">Cost</label>
        <input type="text" id="fare" name="fare" value="Rs.100" readonly />
      </div>

      <div class="form-group">
        <label for="paymentDetails">Payment Details</label>
        <input type="text" id="paymentDetails" name="paymentDetails" placeholder="Card Number" required />
      </div>

      <button type="submit">Generate Ticket</button>
      <br />
      <button><a href="service.html">Back</a></button>
    </form>
    </div>
  </main>
  <footer>
    <hr />
    <p>@2025 SpeedstarTravels Pvt Ltd. All rights reserved</p>
    <p>
      <span style="margin-left:10px;"><i class="fa-brands fa-facebook"></i></span>
      <span style="margin-left:10px;"><i class="fa-brands fa-linkedin"></i></span>
      <span style="margin-left:10px;"><i class="fa-brands fa-x-twitter"></i></span>
      <span style="margin-left:10px;"><i class="fa-brands fa-square-instagram"></i></span>
    </p>
  </footer>
  
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('ticketForm');
    const ticketType = document.getElementById('ticketSelection');
    const fareInput = document.getElementById('fare');

    // Update fare based on ticket type
    ticketType.addEventListener('change', function () {
      let fare;
      switch (ticketType.value) {
        case 'Economy':
          fare = 'Rs.100';
          break;
        case 'Business':
          fare = 'Rs.250';
          break;
        case 'First Class':
          fare = 'Rs.500';
          break;
        default:
          fare = 'Rs.100';
      }
      fareInput.value = fare;
    });

    // Handle form submission
    form.addEventListener('submit', function (e) {
      e.preventDefault(); // Prevent actual form submission

      const name = document.getElementById('passengerName').value.trim();
      const payment = document.getElementById('paymentDetails').value.trim();

      if (name === '' || payment === '') {
        alert('Please fill out all required fields.');
        return;
      }

      // Simulate ticket generation (You can later replace this with actual logic)
      alert(`Ticket generated successfully!\n\nPassenger: ${name}\nType: ${ticketType.value}\nFare: ${fareInput.value}`);
      
      form.reset();
      fareInput.value = 'Rs.100'; // Reset fare to default
    });
  });
</script>

  </script>
</body>
</html>
