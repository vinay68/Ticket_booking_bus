<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #6200ea;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        section {
            margin-bottom: 2rem;
        }
        h2 {
            color: #6200ea;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, select, button {
            width: 97%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #6200ea;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #3700b3;
        }
        .status {
            padding: 1rem;
            border-radius: 4px;
            background-color: #e3f2fd;
            color: #0d47a1;
        }
        .error {
            padding: 1rem;
            border-radius: 4px;
            background-color: #f8d7da;
            color: #842029;
        }
        a{
            text-decoration: none;
            color: white;

        }
        .box1{
            color: #ff8f05;
            margin-top: 30px;
        }
        .box2{
            color: white;
            margin-top: 30px;
        }
        .box3{
            color: #03fc20;
            margin-top: 30px;
        }
        .logo{
            text-align:left;
            font-size: 20px;
        }
        .heading{
            margin-left: 370px;
                    font-size: 30px;
        }
        footer{
            color: white;
            margin-top: 350px;
            background-color: black;
            height: 80px;
        }
        p{
           text-align: center;
        }
    </style>
</head>
<body>
    <header>
      <h1 class="logo"><span class="box1">Speed</span><span class="box2">star</span><span class="box3">Travels</span><span class="heading">Refund Management System</span></h1>
    </header>
    <main>
        <section id="capture-request">
            <h2>Capture Request</h2>
            <label for="request-id">Request ID</label>
            <input type="text" id="request-id" placeholder="Enter Request ID">
            <button onclick="captureRequest()">Submit Request</button>
        </section>

        <section id="process-refund">
            <h2>Process Refund</h2>
            <label for="refund-id">Refund ID</label>
            <input type="text" id="refund-id" placeholder="Enter Refund ID">
            <button onclick="processRefund()">Process Refund</button>
        </section>

        <section id="monitor-status">
            <h2>Monitor Status</h2>
            <label for="status-id">Enter ID</label>
            <input type="text" id="status-id" placeholder="Enter Request or Refund ID">
            <button onclick="monitorStatus()">Check Status</button>
            <br>
            <button type="back"><a href="service.html">Back</a></button>
            <div id="status-display" class="status" style="display: none;"></div>
            <div id="error-message" class="error" style="display: none;">No request found with this ID.</div>
        </section>
    </main>
    <footer>
        <hr>
        <p>@2025 SpeedstarTravels Pvt Ltd.All rights reserved</p>
        <p>
            <span style="margin-left:10px;"><i class="fa-brands fa-facebook"></i></span>
            <span style="margin-left:10px;"><i class="fa-brands fa-linkedin"></i></span>
            <span style="margin-left:10px;"><i class="fa-brands fa-x-twitter"></i></span>
            <span style="margin-left:10px;"><i class="fa-brands fa-square-instagram"></i></span>
        </p>
    </footer>

       <script>
  // Simulated in-memory data storage
  const refundDatabase = {};

  function captureRequest() {
    const requestId = document.getElementById('request-id').value.trim();
    const error = document.getElementById('error-message');
    const status = document.getElementById('status-display');

    if (requestId === '') {
      alert("❌ Request ID cannot be empty.");
      showError("Request ID cannot be empty.");
      return;
    }

    refundDatabase[requestId] = {
      type: 'request',
      status: 'Captured'
    };

    const msg = `✅ Request "${requestId}" has been captured successfully.`;
    alert(msg);
    showStatus(msg);
  }

  function processRefund() {
    const refundId = document.getElementById('refund-id').value.trim();

    if (refundId === '') {
      alert("❌ Refund ID cannot be empty.");
      showError("Refund ID cannot be empty.");
      return;
    }

    refundDatabase[refundId] = {
      type: 'refund',
      status: 'Processed'
    };

    const msg = `💸 Refund "${refundId}" has been processed successfully.`;
    alert(msg);
    showStatus(msg);
  }

  function monitorStatus() {
    const statusId = document.getElementById('status-id').value.trim();

    if (statusId === '') {
      alert("❌ Please enter an ID to check status.");
      showError("Please enter an ID to check status.");
      return;
    }

    const record = refundDatabase[statusId];

    if (record) {
      const label = record.type === 'refund' ? 'Refund' : 'Request';
      const msg = `📌 ${label} "${statusId}" is currently: ${record.status}`;
      alert(msg);
      showStatus(`<strong>${msg}</strong>`);
    } else {
      alert("⚠️ No request or refund found with this ID.");
      showError("No request or refund found with this ID.");
    }
  }

  function showStatus(message) {
    const status = document.getElementById('status-display');
    const error = document.getElementById('error-message');
    status.innerHTML = message;
    status.style.display = 'block';
    error.style.display = 'none';
  }

  function showError(message) {
    const status = document.getElementById('status-display');
    const error = document.getElementById('error-message');
    error.textContent = message;
    error.style.display = 'block';
    status.style.display = 'none';
  }
</script>

  

</body>
</html>
