<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            margin-top: 30px;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            text-decoration: none;
            color: white;
        }
        .box1 {
            color: #ff8f05;
            margin-top: 30px;
        }
        .box2 {
            color: white;
            margin-top: 30px;
        }
        .box3 {
            color: #03fc20;
            margin-top: 30px;
        }
        .logo {
            text-align: left;
            font-size: 20px;
        }
        .heading {
            margin-left: 370px;
            font-size: 30px;
        }
        footer {
            color: white;
            margin-top: 350px;
            background-color: black;
            height: 80px;
        }
        p {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo"><span class="box1">Speed</span><span class="box2">star</span><span class="box3">Travels</span><span class="heading">Reservation Management System</span></h1>
    </header>
    <main>
        <h2>Reservation Form</h2>
        <form id="reservationForm">
            <div class="form-group">
                <label for="passengerName">Passenger Name</label>
                <input type="text" id="passengerName" name="passengerName" required>
            </div>

            <div class="form-group">
                     <label for="seatSelection">Selected Seats</label>
                     <input type="text" id="seatSelection" name="seatSelection" readonly>
            </div>



            <div class="form-group">
                <label for="fare">Ticket Cost</label>
                <input type="text" id="fare" name="fare" value="Rs.100" readonly/>
            </div>

            <div class="form-group">
                <label for="paymentDetails">Payment process</label>
                <img src="phonepe_qr.png" style="width: 200px; height: 200px; display: block; margin:0 auto;"/>
                <input type="hidden" name="paymentDetails" value="Paid via QR">
            </div>

            <button type="submit">Submit Reservation</button>
            <br>
            <button><a href="service.html">Back</a></button>
        </form>
    </main>
    <footer>
        <hr>
        <p>@2025 SpeedstarTravels Pvt Ltd.All rights reserved</p>
        <p>
            <span style="margin-left:10px;"><i class="fa-brands fa-facebook"></i></span>
            <span style="margin-left:10px;"><i class="fa-brands fa-linkedin"></i></span>
            <span style="margin-left:10px;"><i class="fa-brands fa-x-twitter"></i></span>
            <span style="margin-left:10px;"><i class="fa-brands fa-square-instagram"></i></span>
        </p>
    </footer>

    <script>
     document.getElementById("reservationForm").addEventListener("submit", function(event) {         event.preventDefault(); // Prevent actual form submission

         const name = document.getElementById("passengerName").value;
        const seat = document.getElementById("seatSelection").value;

        // Simple validation
         if (!name.trim()) {
             alert("Please enter the passenger name.");
             return;
        }

        // Confirm reservation
         const confirmation = confirm(`Confirm reservation for:\nName: ${name}\nSeat: ${seat}\nFare: Rs.100`);
         if (confirmation) {
             // Simulate success
           alert("Reservation successful!\nThank you for booking with Speedstar Travels.");
           this.reset(); // Reset the form after submission
        }
    });
    // Load selected seat from localStorage
const selectedSeat = localStorage.getItem("selectedSeat");
if (selectedSeat) {
     const seatDropdown = document.getElementById("seatSelection");
    seatDropdown.value = selectedSeat;
 }

  
</script>

   
</body>
</html>
